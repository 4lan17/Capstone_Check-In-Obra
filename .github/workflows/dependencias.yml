name: Revisión de dependencias

# En cada PR, bloquea la incorporación de una dependencia con una vulnerabilidad conocida (SEG11, S-14).
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  revisar:
    name: Dependency review
    # Solo corre con la variable de repositorio GHAS=true: exige GitHub Advanced Security
    # (o un repositorio público) y fallaría en uno privado que no lo tenga.
    if: vars.GHAS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
