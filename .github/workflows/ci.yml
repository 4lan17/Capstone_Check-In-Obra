name: CI

# develop es la rama de integración: los PR llegan ahí antes que a main, así
# que si la CI no corre sobre ella, valida siempre después de haber mezclado.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene
# sentido gastar minutos validando un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot + Maven)
    runs-on: ubuntu-latest

    # contextLoads es un @SpringBootTest: levanta el contexto completo, así que
    # necesita una base real. Flyway corre las migraciones sobre esta instancia
    # vacía y Hibernate (ddl-auto=validate) comprueba que el mapeo calce.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: checkinobra
          # Superusuario de un contenedor efimero del runner: no es alcanzable desde
          # fuera de el. La API y Flyway no lo usan; ver el paso de roles.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d checkinobra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Instalar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # La API conecta como checkinobra_app (solo DML) y Flyway como
      # checkinobra_migrador, igual que en docker-compose. Las contraseñas se
      # generan en cada corrida y se enmascaran en el log.
      - name: Crear los roles de base de datos
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: checkinobra
        run: |
          app_pw="$(openssl rand -hex 24)"
          migrador_pw="$(openssl rand -hex 24)"
          echo "::add-mask::$app_pw"
          echo "::add-mask::$migrador_pw"
          echo "DB_APP_PASSWORD=$app_pw" >> "$GITHUB_ENV"
          echo "DB_MIGRADOR_PASSWORD=$migrador_pw" >> "$GITHUB_ENV"
          CHECKINOBRA_APP_PASSWORD="$app_pw" \
          CHECKINOBRA_MIGRADOR_PASSWORD="$migrador_pw" \
            ./db/crear-roles.sh

      - name: Compilar y testear
        working-directory: backend
        env:
          # El servicio queda expuesto en localhost:5432 del runner, no en 5433
          # como en docker-compose (ahí ese puerto evita choques con otro
          # Postgres local; en CI no hay nada más escuchando).
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/checkinobra
          SPRING_DATASOURCE_USERNAME: checkinobra_app
          SPRING_DATASOURCE_PASSWORD: ${{ env.DB_APP_PASSWORD }}
          FLYWAY_USER: checkinobra_migrador
          FLYWAY_PASSWORD: ${{ env.DB_MIGRADOR_PASSWORD }}
        run: ./mvnw -B verify

      - name: Publicar reportes de test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          # Fijada a la misma versión que se usa en desarrollo. Al subirla,
          # actualizar también el environment.sdk de mobile/pubspec.yaml.
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Preparar .env
        working-directory: mobile
        # pubspec.yaml declara .env como asset y el archivo real no se versiona,
        # así que sin esta copia el bundle de assets no se arma y falla el build.
        run: cp .env.example .env

      - name: Descargar dependencias
        working-directory: mobile
        run: flutter pub get

      - name: Verificar formato
        working-directory: mobile
        # dart format cambio de estilo por defecto en Dart 3.7; el codigo se
        # normalizo a ese estilo, asi que este paso lo mantiene estable.
        run: dart format --output=none --set-exit-if-changed .

      - name: Analizar
        working-directory: mobile
        run: flutter analyze

      - name: Testear
        working-directory: mobile
        run: flutter test

      - name: Compilar APK de debug
        working-directory: mobile
        # Debug y no release: el release necesita keystore de firma, que no
        # está en el repo. Igual valida que Gradle y el lado Android compilen.
        run: flutter build apk --debug
