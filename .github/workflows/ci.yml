name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene
# sentido gastar minutos validando un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot + Maven)
    runs-on: ubuntu-latest

    # contextLoads es un @SpringBootTest: levanta el contexto completo, así que
    # necesita una base real. Flyway corre las migraciones sobre esta instancia
    # vacía y Hibernate (ddl-auto=validate) comprueba que el mapeo calce.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: checkinobra
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d checkinobra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Instalar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compilar y testear
        working-directory: backend
        env:
          # El servicio queda expuesto en localhost:5432 del runner, no en 5433
          # como en docker-compose (ahí ese puerto evita choques con otro
          # Postgres local; en CI no hay nada más escuchando).
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/checkinobra
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: ./mvnw -B verify

      - name: Publicar reportes de test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          # Fijada a la misma versión que se usa en desarrollo. Al subirla,
          # actualizar también el environment.sdk de mobile/pubspec.yaml.
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Preparar .env
        working-directory: mobile
        # pubspec.yaml declara .env como asset y el archivo real no se versiona,
        # así que sin esta copia el bundle de assets no se arma y falla el build.
        run: cp .env.example .env

      - name: Descargar dependencias
        working-directory: mobile
        run: flutter pub get

      - name: Verificar formato
        working-directory: mobile
        # dart format cambio de estilo por defecto en Dart 3.7; el codigo se
        # normalizo a ese estilo, asi que este paso lo mantiene estable.
        run: dart format --output=none --set-exit-if-changed .

      - name: Analizar
        working-directory: mobile
        run: flutter analyze

      - name: Testear
        working-directory: mobile
        run: flutter test

      - name: Compilar APK de debug
        working-directory: mobile
        # Debug y no release: el release necesita keystore de firma, que no
        # está en el repo. Igual valida que Gradle y el lado Android compilen.
        run: flutter build apk --debug
