spring.application.name=checkinobra

# Datasource de la API: usuario checkinobra_app, solo DML (ver db/roles.sql).
# Sin usuario ni contraseña por defecto: si faltan, la API no arranca. Vienen del
# .env (docker-compose) o del entorno (IDE, CI); ver .env.example.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/checkinobra}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# El esquema lo maneja Flyway (db/migration); Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
# Desactivado: con true la conexión queda tomada hasta terminar de serializar la
# respuesta, y un acceso perezoso fuera de la transacción pasaba sin avisar.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
# Flyway conecta con checkinobra_migrador, dueño del esquema (DDL). Si no se define
# FLYWAY_USER usa el de la API, que solo sirve contra una base de un único usuario.
spring.flyway.user=${FLYWAY_USER:${SPRING_DATASOURCE_USERNAME}}
spring.flyway.password=${FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.flyway.locations=classpath:db/migration

# Correo (Brevo SMTP) — credenciales reales solo en backend/.env, nunca en el repo.
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USER:}
spring.mail.password=${BREVO_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT — sin valor por defecto: JwtService se niega a arrancar si JWT_SECRET falta,
# tiene menos de 32 bytes o es el valor de ejemplo. Generar uno: openssl rand -base64 48
checkinobra.jwt.secret=${JWT_SECRET:}
checkinobra.jwt.expiracion-minutos=480

# Importación masiva — las planillas de catálogo son de kilobytes, no de megas.
# El tope está para que un archivo equivocado falle rápido y con un mensaje
# claro, en vez de ocupar memoria del servidor mientras se sube entero.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
