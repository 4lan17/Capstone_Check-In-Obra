spring.application.name=checkinobra

# Datasource — sobrescrito por variables de entorno en Docker (ver docker-compose.yml)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/checkinobra}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# El esquema lo maneja Flyway (db/migration); Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Correo (Brevo SMTP) — credenciales reales solo en backend/.env, nunca en el repo.
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USER:}
spring.mail.password=${BREVO_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
checkinobra.jwt.secret=${JWT_SECRET:cambiar-por-un-valor-largo-y-aleatorio}
checkinobra.jwt.expiracion-minutos=480

# Login — bloqueo creciente por cuenta y por IP tras fallos seguidos (S-02).
# La cuenta tolera 5 fallos y se bloquea 1 min; luego cada fallo la bloquea de
# nuevo con el doble, hasta 1 h. La IP tolera 30 y se bloquea 5 min.
checkinobra.login.cuenta.max-fallos=5
checkinobra.login.cuenta.bloqueo-base-segundos=60
checkinobra.login.cuenta.bloqueo-maximo-segundos=3600
checkinobra.login.ip.max-fallos=30
checkinobra.login.ip.bloqueo-base-segundos=300
checkinobra.login.ip.bloqueo-maximo-segundos=3600
checkinobra.login.olvido-segundos=86400

# Importación masiva — las planillas de catálogo son de kilobytes, no de megas.
# El tope está para que un archivo equivocado falle rápido y con un mensaje
# claro, en vez de ocupar memoria del servidor mientras se sube entero.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
